spring:
  application:
    name: ticketgo-api

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  # Database
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  datasource:
    url: jdbc:mysql://localhost:3306/ticketgo_db
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:371902}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:50}
      minimum-idle: ${DB_POOL_MIN_IDLE:10}
      connection-timeout: 10000
      idle-timeout: 300000
      max-lifetime: 1200000
      leak-detection-threshold: 60000
      pool-name: TicketGoHikariPool

  # Flyway
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration
    validate-on-migrate: true
  # Redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 5000ms

  # Kafka
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: ticketgo-email-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.gnxrt.ticketgoapi.dto.event
      auto-offset-reset: earliest

  # Email
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  # Thymeleaf
  thymeleaf:
    prefix: classpath:/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: false  # Set true in production

  # File upload
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:10MB}
      max-request-size: ${MAX_FILE_SIZE:10MB}
  config:
    import: optional:file:env.properties

# Cloudinary
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}
  folder: ${CLOUDINARY_FOLDER:ticketgo/avatars}

# JWT
jwt:
  secret: ${JWT_SECRET:}
  expiration: 86400000
  refresh-expiration: 604800000


# AI Service
ai:
  service:
    url: ${AI_SERVICE_URL:http://localhost:8001}

# VNPay
vnpay:
  tmn-code: ${VNPAY_TMN_CODE:}
  hash-secret: ${VNPAY_HASH_SECRET:}
  pay-url: ${VNPAY_URL:}
  return-url: ${VNPAY_RETURN_URL:}

# Application
app:
  base-url: ${APP_BASE_URL:}
  frontend-url: ${APP_FRONTEND_URL:}

  # Email config
  email:
    from-address: ${MAIL_USERNAME:noreply@ticketgo.vn}
    from-name: TicketGo
    support-email: support@ticketgo.vn
    hotline: "1900 1234"
    logo-url: ${APP_FRONTEND_URL:http://localhost:3000}/logo.png
    frontend-url: ${APP_FRONTEND_URL:http://localhost:3000}

  # QR Code
  qrcode:
    width: ${QRCODE_WIDTH:300}
    height: ${QRCODE_HEIGHT:300}
    secret-key: ${QRCODE_SECRET_KEY}

  # Upload
  upload:
    dir: ${UPLOAD_DIR:uploads}

# Server
server:
  port: 8080

# Actuator + Metrics
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  prometheus:
    metrics:
      export:
        enabled: true

# Logging
logging:
  level:
    com.gnxrt.ticketgoapi: DEBUG
    org.springframework.mail: DEBUG